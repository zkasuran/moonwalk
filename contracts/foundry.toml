[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
# Arc runs the Cancun opcodes: TSTORE/TLOAD (EIP-1153), MCOPY (EIP-5656) and
# PUSH0 (EIP-3855) all work, so "cancun" is a safe target and it unblocks any
# dependency that needs transient storage. Gas on Arc is USDC and cheap, so
# there is no reason to hold back to an older instruction set.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_reports = ["NanoChannel", "SpendGuard", "ServiceRegistry"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# Arcscan has no verification API key requirement documented yet, so contract
# source is published in this repo and the deployment receipts carry the
# compiler settings needed to reproduce the bytecode.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
